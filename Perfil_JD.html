<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #4CAF50;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-header img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        .profile-info {
            font-size: 18px;
            line-height: 1.6;
        }

        .profile-info p {
            margin: 10px 0;
        }

        .profile-info strong {
            color: #333;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 14px;
            color: #888;
        }

        .styled-button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .styled-button:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Perfil del Alumno</h1>

        <div class="profile-header">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTIvSTZ7rlQiGKcHVGeDFNtZZwry2Pj837-hZ44wJeZzq43ZueXo-8OE0JI7KK9fnh2mmw&usqp=CAU"
                alt="Avatar del Alumno">
            <h2>Juan Diego González Hernández</h2>
        </div>

        <div class="profile-info">
            <p><strong>Nombre Completo:</strong> Juan Diego González Hernández </p>
            <p><strong>Carrera:</strong> Ingeniería en Desarrollo y Gestion de Software</p>
            <p><strong>Hobbies o Intereses:</strong> Programación, Videojuegos, Caligrafia </p>
        </div>

        <div class="footer">
            <button class="styled-button">Volver</button>
            <p>&copy; 2025 Todos los derechos reservados.</p>
        </div>
    </div>
</body>

</html>
